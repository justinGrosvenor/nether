# HVF recipe for a warm Python HTTP server.
# Prerequisites (from the repository root):
#   ./scripts/fetch-guest-image.sh
#   Prepare kernels/rootfs as described in docs/provisioning.md, then:
#   ./tools/build-guest-aarch64-runtimes.sh   # Docker; includes Python
#   ./scripts/bake.py bake examples/base.nether.toml
#   ./scripts/bake.py fork examples/base.snap --name tenant-1
#
# Optional top-level guest user setting, before all tables:
# run_as = "nether"

[image]
# Image paths are relative to THIS recipe directory.
# The runner links this directory as kernels/ and expects these exact basenames.
kernel = "../kernels/Image"
initramfs = "../kernels/initramfs.cpio.gz"

[resources]
ram_mb = 512
cpus = 2

[network]
egress = "deny"  # leaves the NIC off; the vsock data bridge still serves HTTP

[[warmup]]
start = "python3 -m http.server 8080 --bind 127.0.0.1 --directory /tmp"

[ready]
# A command avoids relying on the guest shell's /dev/tcp extension.
port = 8080     # also tells the runner to emit app_port=8080
command = "python3 -c \"import socket; socket.create_connection(('127.0.0.1',8080),1).close()\""

[snapshot]
out = "base.snap"  # produces examples/base.snap
compress = "none"  # or "deflate"; fork rehydrates compressed bases first

# Optional persistent storage (outside the snapshot, shared if forks reuse it):
# [disk]
# file = "/absolute/path/app.img"
# size_mb = 64
#
# The runner does not consume snapshot.kind/sparse/ttl_s. It rejects a nonempty
# snapshot.base. disk.size_mb without disk.file does not resize the ephemeral disk.
# See docs/provisioning.md for transfer, cache, and fork-config limitations.
